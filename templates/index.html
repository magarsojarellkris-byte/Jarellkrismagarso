
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student API Interface</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f2f2f2;
            color: #333;
        }

        h1, h2, h3 {
            color: #333;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }

        button:hover {
            background-color: #0056b3;
        }

        input, select {
            display: block;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 8px 0;
        }

        #result,
        #greeting,
        #multiplyResult,
        #studentList,
        #programResults,
        #sectionResults,
        #yearResults {
            background-color: white;
            padding: 15px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            overflow-wrap: anywhere;
            min-height: 20px;
        }

        hr {
            border: none;
            border-top: 1px solid #ccc;
            margin: 25px 0;
        }

        .section {
            margin-top: 20px;
        }

        .student-record {
            border-bottom: 1px solid #ddd;
            padding: 8px 0;
        }

        .student-record:last-child {
            border-bottom: none;
        }

        .error {
            color: #c62828;
        }

        .success {
            color: #176b35;
        }
    </style>
</head>

<body>
    <h1>Student API Interface</h1>

    <!-- Single Student -->
    <div class="section">
        <h2>Student Information</h2>

        <label for="studentIdInput">Database Student ID:</label>
        <input type="number" id="studentIdInput" min="1" step="1" value="1">

        <button type="button" onclick="loadStudent()">
            Load Student Information
        </button>

        <div id="result" aria-live="polite"></div>
    </div>

    <hr>

    <!-- All Students -->
    <div class="section">
        <h2>Students from Database</h2>

        <button type="button" onclick="loadStudents()">
            Load Students
        </button>

        <div id="studentList" aria-live="polite"></div>
    </div>

    <hr>

    <!-- Filter by Program -->
    <div class="section">
        <h2>Search Students by Program</h2>

        <label for="programInput">Choose a program:</label>
        <select id="programInput">
            <option value="">Select a program</option>
            <option value="BSIT">BSIT</option>
            <option value="BSHM">BSHM</option>
            <option value="BSED">BSED</option>
        </select>

        <button type="button" onclick="loadStudentsByProgram()">
            Search Program
        </button>

        <div id="programResults" aria-live="polite"></div>
    </div>

    <hr>

    <!-- Filter by Section -->
    <div class="section">
        <h2>Search Students by Section</h2>

        <label for="sectionInput">Choose a section:</label>
        <select id="sectionInput">
            <option value="">Select a section</option>
            <option value="A">Section A</option>
            <option value="B">Section B</option>
            <option value="C">Section C</option>
        </select>

        <button type="button" onclick="loadStudentsBySection()">
            Search Section
        </button>

        <div id="sectionResults" aria-live="polite"></div>
    </div>

    <hr>

    <!-- NEW: Filter by Year Level -->
    <div class="section">
        <h2>Search Students by Year Level</h2>

        <label for="yearInput">Choose a year level:</label>
        <select id="yearInput">
            <option value="">Select a year level</option>
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
        </select>

        <button type="button" onclick="loadStudentsByYear()">
            Search Year Level
        </button>

        <div id="yearResults" aria-live="polite"></div>
    </div>

    <hr>

    <!-- Greeting API -->
    <div class="section">
        <h2>Greeting API</h2>

        <label for="nameInput">Your name:</label>
        <input type="text" id="nameInput" placeholder="Enter your first name">

        <button type="button" onclick="sayHello()">
            Say Hello
        </button>

        <p id="greeting" aria-live="polite"></p>
    </div>

    <hr>

    <!-- Multiply API -->
    <div class="section">
        <h2>Multiply API</h2>

        <p>Enter two numbers to multiply:</p>

        <label for="num1">First number:</label>
        <input type="number" id="num1" placeholder="Enter first number" step="any">

        <label for="num2">Second number:</label>
        <input type="number" id="num2" placeholder="Enter second number" step="any">

        <button type="button" onclick="multiplyNumbers()">
            Multiply
        </button>

        <div id="multiplyResult" aria-live="polite"></div>
    </div>

    <script>
        // Common API request function
        async function apiRequest(url) {
            const response = await fetch(url);
            let data;

            try {
                data = await response.json();
            } catch {
                throw new Error("The server returned an invalid response.");
            }

            if (!response.ok) {
                throw new Error(data.error || "The request failed.");
            }

            return data;
        }

        // Display an error message
        function showError(output, error) {
            console.error(error);
            output.replaceChildren();

            const message = document.createElement("p");
            message.className = "error";
            message.textContent = error.message || "Something went wrong.";

            output.appendChild(message);
        }

        // Display one student's information
        function displayStudent(student, output) {
            const record = document.createElement("div");

            const yearLabels = {
                1: "1st Year",
                2: "2nd Year",
                3: "3rd Year",
                4: "4th Year"
            };

            const year = student.year ?? student.year_level;

            const fields = [
                ["Database ID", student.id],
                ["Student ID", student.student_id],
                ["Name", student.name],
                ["Program", student.program],
                ["Year Level", yearLabels[year] ?? year],
                ["Section", student.section]
            ];

            fields.forEach(([label, value]) => {
                if (value === undefined || value === null) {
                    return;
                }

                const p = document.createElement("p");
                const b = document.createElement("strong");

                b.textContent = label + ": ";
                p.appendChild(b);
                p.appendChild(document.createTextNode(String(value)));

                record.appendChild(p);
            });

            output.appendChild(record);
        }

        // Display a list of students
        function displayStudents(students, output, emptyMessage) {
            output.replaceChildren();

            if (!Array.isArray(students)) {
                throw new Error("Unexpected student data format.");
            }

            if (students.length === 0) {
                output.textContent = emptyMessage;
                return;
            }

            students.forEach(student => {
                const p = document.createElement("p");
                p.className = "student-record";

                const yearLabels = {
                    1: "1st Year",
                    2: "2nd Year",
                    3: "3rd Year",
                    4: "4th Year"
                };

                const year = student.year ?? student.year_level;
                const yearText = yearLabels[year] ?? year ?? "N/A";

                p.textContent =
                    (student.student_id ?? student.id ?? "N/A") +
                    " - " + (student.name ?? "Unknown") +
                    " | " + (student.program ?? "N/A") +
                    " | " + yearText +
                    " | Section " + (student.section ?? "N/A");

                output.appendChild(p);
            });
        }

        // Load one student by database ID
        async function loadStudent() {
            const id = document.getElementById("studentIdInput").value.trim();
            const output = document.getElementById("result");

            if (!id || !Number.isSafeInteger(Number(id)) || Number(id) < 1) {
                output.textContent = "Please enter a valid student ID.";
                return;
            }

            output.textContent = "Loading student...";

            try {
                const student = await apiRequest(
                    "/students/" + encodeURIComponent(id)
                );

                output.replaceChildren();
                displayStudent(student, output);
            } catch (error) {
                showError(output, error);
            }
        }

        // Load all students
        async function loadStudents() {
            const output = document.getElementById("studentList");
            output.textContent = "Loading students...";

            try {
                const students = await apiRequest("/students");
                displayStudents(students, output, "No student records found.");
            } catch (error) {
                showError(output, error);
            }
        }

        // Search students by program
        async function loadStudentsByProgram() {
            const program = document.getElementById("programInput").value;
            const output = document.getElementById("programResults");

            if (!program) {
                output.textContent = "Please select a program.";
                return;
            }

            output.textContent = "Loading students...";

            try {
                const params = new URLSearchParams({ program });
                const students = await apiRequest(
                    "/students/program?" + params.toString()
                );

                displayStudents(
                    students,
                    output,
                    "No students found for " + program + "."
                );
            } catch (error) {
                showError(output, error);
            }
        }

        // Search students by section
        async function loadStudentsBySection() {
            const section = document.getElementById("sectionInput").value;
            const output = document.getElementById("sectionResults");

            if (!section) {
                output.textContent = "Please select a section.";
                return;
            }

            output.textContent = "Loading students...";

            try {
                const params = new URLSearchParams({ section });
                const students = await apiRequest(
                    "/students/section?" + params.toString()
                );

                displayStudents(
                    students,
                    output,
                    "No students found in Section " + section + "."
                );
            } catch (error) {
                showError(output, error);
            }
        }

        // NEW: Search students by year level
        async function loadStudentsByYear() {
            const year = document.getElementById("yearInput").value;
            const output = document.getElementById("yearResults");

            if (!year) {
                output.textContent = "Please select a year level.";
                return;
            }

            output.textContent = "Loading students...";

            try {
                const params = new URLSearchParams({ year });
                const students = await apiRequest(
                    "/students/year?" + params.toString()
                );

                const labels = {
                    1: "1st Year",
                    2: "2nd Year",
                    3: "3rd Year",
                    4: "4th Year"
                };

                output.replaceChildren();

                const heading = document.createElement("h3");
                heading.textContent = "Students - " + labels[year];
                output.appendChild(heading);

                displayStudents(
                    students,
                    output,
                    "No students found in " + labels[year] + "."
                );
            } catch (error) {
                showError(output, error);
            }
        }

        // Greeting API
        async function sayHello() {
            const name = document.getElementById("nameInput").value.trim();
            const output = document.getElementById("greeting");

            if (!name) {
                output.textContent = "Please enter your name.";
                return;
            }

            output.textContent = "Loading greeting...";

            try {
                const params = new URLSearchParams({ name });
                const data = await apiRequest("/hello?" + params.toString());
                output.textContent = data.message;
            } catch (error) {
                showError(output, error);
            }
        }

        // Multiply API
        async function multiplyNumbers() {
            const num1Input = document.getElementById("num1");
            const num2Input = document.getElementById("num2");
            const output = document.getElementById("multiplyResult");

            if (
                num1Input.value.trim() === "" ||
                num2Input.value.trim() === ""
            ) {
                output.textContent = "Please enter both numbers.";
                return;
            }

            const num1 = num1Input.valueAsNumber;
            const num2 = num2Input.valueAsNumber;

            if (!Number.isFinite(num1) || !Number.isFinite(num2)) {
                output.textContent = "Please enter valid numbers.";
                return;
            }

            output.textContent = "Calculating...";

            try {
                const params = new URLSearchParams({
                    num1: String(num1),
                    num2: String(num2)
                });

                const data = await apiRequest(
                    "/multiply?" + params.toString()
                );

                output.replaceChildren();

                [
                    ["First Number", data.number1],
                    ["Second Number", data.number2],
                    ["Result", data.result]
                ].forEach(([label, value]) => {
                    const p = document.createElement("p");
                    const b = document.createElement("strong");

                    b.textContent = label + ": ";
                    p.appendChild(b);
                    p.appendChild(document.createTextNode(String(value)));

                    output.appendChild(p);
                });
            } catch (error) {
                showError(output, error);
            }
        }
    </script>
</body>
</html>
